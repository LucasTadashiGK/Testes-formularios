<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Formulario de contato</h1>
    <form action="https://formspree.io/f/mnnbkleo" method="POST">

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
        
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Digite seu email">

        <label for="mensagem">Mensagem</label>
        <textarea name="mensagem" id="mensagem" rows="4" placeholder="Digite sua mensagem"></textarea> 
    
        <div class="checkbox-grupo">
         <input type="checkbox" id="chk1" name="checkbox" required>
        <label for="chk1">Concordo em divulgar meus dados</label>
        </div> 

        <button type="submit">Enviar</button>
        
       
    </form>
    
</body>
</html>
